monolog:
    channels:
        - deprecation

    handlers:
        main:
            type: stream
            path: php://stderr
            level: info
            channels: ['!event', '!deprecation']

        console:
            type: console
            process_psr_3_messages: false
            channels: ['!event', '!doctrine', '!console', '!deprecation']

    use_console_handler: true
