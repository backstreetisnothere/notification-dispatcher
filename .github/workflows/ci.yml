name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest

        services:
            redis:
                image: redis:7.2-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

        env:
            REDIS_URL: redis://127.0.0.1:6379/15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: none
                  extensions: amqp, pdo_pgsql, redis
                  tools: composer:v2

            - name: Validate Composer manifest
              run: composer validate --strict --no-check-publish --no-check-lock

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: PHP syntax validation
              run: composer lint:php

            - name: Unit tests
              run: composer test

            - name: Integration tests
              run: composer test:integration

            - name: Dependency security audit
              run: composer audit

            - name: Validate Docker Compose
              run: docker compose config --quiet

            - name: Build application image
              run: docker build --tag notification-outbox-dispatcher:ci .

    docker-smoke-test:
        runs-on: ubuntu-latest
        needs: tests

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Start infrastructure
              run: docker compose up -d postgres rabbitmq redis

            - name: Wait for infrastructure
              run: |
                  docker compose exec -T postgres pg_isready -U notification -d notification
                  docker compose exec -T rabbitmq rabbitmq-diagnostics -q ping
                  docker compose exec -T redis redis-cli ping

            - name: Build application
              run: docker compose build app

            - name: Start application processes
              run: docker compose up -d

            - name: Wait for readiness
              run: |
                  for attempt in $(seq 1 60); do
                    if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  docker compose logs
                  exit 1

            - name: Create notification
              run: |
                  curl --fail-with-body \
                    --request POST \
                    --header 'Content-Type: application/json' \
                    --data '{
                      "destinations": {
                        "email": "john.doe@example.test"
                      },
                      "template": "welcome",
                      "variables": {
                        "firstName": "John"
                      }
                    }' \
                    http://127.0.0.1:8080/api/v1/notifications

            - name: Collect logs
              if: always()
              run: docker compose logs --no-color

            - name: Stop containers
              if: always()
              run: docker compose down -v
