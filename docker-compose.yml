x-application: &application
    image: notification-outbox-dispatcher:local
    build:
        context: .
        dockerfile: Dockerfile
    env_file:
        - .env
    environment:
        APP_ENV: dev
        APP_DEBUG: "1"
        DATABASE_URL: "postgresql://notification:notification@postgres:5432/notification?serverVersion=16&charset=utf8"
        REDIS_URL: "redis://redis:6379/0"
        MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f"
    restart: unless-stopped
    depends_on:
        postgres:
            condition: service_healthy
        rabbitmq:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: notification
            POSTGRES_USER: notification
            POSTGRES_PASSWORD: notification
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    redis:
        image: redis:7.2-alpine
        command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    app:
        <<: *application
        command: ["/app/bin/start-web"]
        ports:
            - "8080:8080"
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
            interval: 5s
            timeout: 3s
            retries: 30

    outbox-publisher:
        <<: *application
        command:
            - php
            - bin/console
            - app:outbox:publish
            - --watch
            - --limit=100
            - --sleep-ms=500
        depends_on:
            app:
                condition: service_healthy

    notification-worker:
        <<: *application
        command:
            - php
            - bin/console
            - messenger:consume
            - notifications
            - --keepalive=30
            - --time-limit=3600
            - --memory-limit=256M
            - --failure-limit=100
        depends_on:
            app:
                condition: service_healthy

volumes:
    postgres-data:
    rabbitmq-data:
    redis-data:
